name: Metrics

on:
  schedule: [{cron: "17 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # base header (joined / followed by / contributed to + 直近コミットカレンダー)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header
          config_timezone: Asia/Tokyo
      # most used languages (Solarized色で着色)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: 0:#2aa198, 1:#268bd2, 2:#b58900, 3:#cb4b16, 4:#6c71c4, 5:#859900, 6:#d33682, 7:#dc322f
          config_timezone: Asia/Tokyo
